name: Build APK
on:
  workflow_dispatch:
  push:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null; $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;26.1.10909125" "cmake;3.22.1"
      - run: python3 patch.py
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "7.6.4"
      - run: gradle assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: hackerskeyboard-alpha-debug
          path: app/build/outputs/apk/debug/*.apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk GlassKeyboard.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest GlassKeyboard.apk --target ${{ github.sha }} --title "Glass Keyboard (latest)" --notes "Hacker's Keyboard 1.40.7 fork with adjustable opacity and overlay mode."
